services:
  - type: web
    name: dtg-learning-platform
    runtime: node
    region: frankfurt
    plan: free
    branch: main

    buildCommand: npm ci --include=dev && npm run db:migrate:deploy && npm run build && cp -r public .next/standalone/ && mkdir -p .next/standalone/.next && cp -r .next/static .next/standalone/.next/

    startCommand: npm start

    healthCheckPath: /api/v1/health/ready

    maxShutdownDelaySeconds: 30

    envVars:
      - key: NODE_ENV
        value: production

      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

      - key: APP_URL
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: DIRECT_URL
        sync: false

      - key: CORS_ORIGINS
        sync: false

      - key: TRUST_PROXY_HEADERS
        value: "true"

      - key: RATE_LIMIT_SALT
        generateValue: true

      - key: BETTER_AUTH_SECRET
        generateValue: true

      - key: DB_READINESS_TIMEOUT_MS
        value: "4000"

      - key: LOG_LEVEL
        value: info

      - key: METRICS_ENABLED
        value: "true"

      - key: R2_BUCKET
        sync: false

      - key: R2_S3_ENDPOINT
        sync: false

      - key: R2_PUBLIC_BASE_URL
        sync: false

      - key: R2_ACCESS_KEY_ID
        sync: false

      - key: R2_SECRET_ACCESS_KEY
        sync: false