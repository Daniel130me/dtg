services:
  - type: web
    name: dtg-learning-platform
    runtime: node
    region: frankfurt
    # Free is suitable for a short live test. See docs/RENDER_DEPLOYMENT.md for
    # its sleep, SMTP, filesystem, and migration trade-offs.
    plan: free
    branch: main
    autoDeployTrigger: checksPass

    # Render Free has no pre-deploy command. Keep migration last so compilation
    # failures cannot modify the database.
    buildCommand: npm ci --include=dev && npm run build && cp -r public .next/standalone/ && mkdir -p .next/standalone/.next && cp -r .next/static .next/standalone/.next/ && npm run db:migrate:deploy

    startCommand: npm start

    healthCheckPath: /api/v1/health/ready

    maxShutdownDelaySeconds: 30

    envVars:
      - key: NODE_ENV
        value: production

      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

      - key: NEXT_OUTPUT
        value: standalone

      - key: HOSTNAME
        value: 0.0.0.0

      - key: APP_URL
        sync: false

      - key: DATABASE_URL
        sync: false

      - key: DIRECT_URL
        sync: false

      - key: CORS_ORIGINS
        sync: false

      - key: TRUSTED_PROXY_PROVIDER
        value: render

      - key: RATE_LIMIT_SALT
        generateValue: true

      - key: BETTER_AUTH_SECRET
        generateValue: true

      - key: DB_READINESS_TIMEOUT_MS
        value: "4000"

      - key: LOG_LEVEL
        value: info

      - key: METRICS_ENABLED
        value: "true"

      - key: R2_BUCKET
        sync: false

      - key: R2_S3_ENDPOINT
        sync: false

      - key: R2_PUBLIC_BASE_URL
        sync: false

      - key: R2_ACCESS_KEY_ID
        sync: false

      - key: R2_SECRET_ACCESS_KEY
        sync: false

      - key: OWNER_EMAIL
        sync: false
