name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dtg
          POSTGRES_PASSWORD: dtg_test_password
          POSTGRES_DB: dtg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dtg -d dtg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: postgresql://dtg:dtg_test_password@localhost:5432/dtg_test
      DIRECT_URL: postgresql://dtg:dtg_test_password@localhost:5432/dtg_test
      TEST_DATABASE_URL: postgresql://dtg:dtg_test_password@localhost:5432/dtg_test
      APP_URL: http://localhost:3000
      RATE_LIMIT_SALT: ci-only-rate-limit-salt-value
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
